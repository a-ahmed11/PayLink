services:
  web:
    build: .
    ports:
      - "8080"
  db:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD : 12345
      MYSQL_DATABASE : PAYLINK
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
       - mysql_data:/var/lib/mysql
volumes:
  mysql_data: